name: secret-scan

# Server-side backstop for the local scripts/hooks/pre-commit guard. Runs
# gitleaks over the push/PR (full history on push, the PR range on PRs) and
# fails the check if anything credential-shaped lands. Rotate on a true hit —
# removing from git does not un-expose a secret that already reached a runner.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so a secret buried in an
                                    # older commit is caught, not just the tip
      - name: gitleaks detect
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code=1
