[project]
name = "ivideo"
version = "0.1.0"
description = "Instructional video pipeline: OpenRouter writes the dialogue, Claude Opus agents write Manim animation, Kokoro speaks, ffmpeg assembles."
requires-python = ">=3.11,<3.14"
dependencies = [
    "manim==0.22.1",
    "kokoro-onnx==0.6.1",
    "soundfile>=0.13",
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ivideo = "ivideo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ivideo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
